name: Generate Contribution Animation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'picture.png'
      - 'assets/baroque/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-contribution-animation.yml'

permissions:
  contents: write

concurrency:
  group: generate-contribution-animation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install generator dependencies
        run: npm ci

      - name: Generate animated SVGs
        run: node scripts/generate-spirit-vein-svg.cjs
        env:
          CONTRIBUTION_USERNAME: ${{ github.repository_owner }}

      - name: Commit and push updated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update contribution animation [skip ci]'
          file_pattern: 'TTTimsy-contribution-animation*.svg'
